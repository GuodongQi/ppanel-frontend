name: Custom Release

on:
  push:
    tags:
      - "custom-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example custom-v1.22.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish custom frontend
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'custom' || github.ref }}

      - name: Validate or create release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^custom-v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $RELEASE_TAG" >&2
            echo "Expected format: custom-v1.22.0.1" >&2
            exit 1
          fi

          git fetch origin custom --tags
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if ! git merge-base --is-ancestor "$RELEASE_TAG^{}" origin/custom; then
              echo "$RELEASE_TAG does not point to the custom branch" >&2
              exit 1
            fi
            git checkout --detach "$RELEASE_TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Custom frontend release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            node_modules
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          tar -czf ppanel-admin-web.tar.gz -C apps/admin/dist .
          tar -czf ppanel-user-web.tar.gz -C apps/user/dist .
          sha256sum ppanel-admin-web.tar.gz ppanel-user-web.tar.gz > SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes "Custom PPanel frontend build from the custom branch."
          fi
          gh release upload "$RELEASE_TAG" \
            ppanel-admin-web.tar.gz \
            ppanel-user-web.tar.gz \
            SHA256SUMS \
            --clobber
